upstream crumbs_web {
    server web:8000;
    keepalive 32;
}

# HTTP — ACME challenges + redirect to HTTPS when SSL is enabled
server {
    listen 80;
    server_name localhost www.localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # User uploads — static files only; never execute as scripts (see DEPLOYMENT_ENV_CHECKLIST.md)
    location /media/ {
        alias /var/www/media/;
        default_type application/octet-stream;
        types {
            application/pdf pdf;
        }
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Before SSL: proxy to Django. After SSL: use crumbs-ssl.conf (HTTP redirects).
    location / {
        proxy_pass http://crumbs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
