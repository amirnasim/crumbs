{% load static %}
{% with variant=variant|default:"default" size=size|default:"header" %}
<a href="{% url 'core:home' %}" class="brand-logo-link brand-logo-link--{{ size }}" aria-label="صفحه اصلی Crumbs">
  <img
    src="{% if variant == 'on-dark' %}{% static 'img/crumbs-logo-on-dark.png' %}{% else %}{% static 'img/crumbs-logo.png' %}{% endif %}"
    alt=""
    class="brand-logo brand-logo--{{ size }}"
    width="785"
    height="483"
    decoding="async"
    {% if size == "header" or size == "drawer" %}fetchpriority="high"{% endif %}
  >
</a>
{% endwith %}
