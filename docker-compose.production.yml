# CRUMBS — Production VPS stack (Ubuntu 22.04+)
#
# First deploy:  ./deploy/deploy.sh init
# Update/rebuild: ./deploy/deploy.sh update
# Backup:         ./deploy/backup.sh all
# Migrations only: ./deploy/deploy.sh migrate
# Collectstatic only: ./deploy/deploy.sh collectstatic
# SSL setup:      ./deploy/init-ssl.sh
#
# Requires: Docker 24+, Docker Compose v2, .env configured on server

services:
  db:
    image: postgres:16-alpine
    container_name: crumbs_prod_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crumbs}
      POSTGRES_USER: ${POSTGRES_USER:-crumbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crumbs} -d ${POSTGRES_DB:-crumbs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - crumbs_prod

  redis:
    image: redis:7-alpine
    container_name: crumbs_prod_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - crumbs_prod

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crumbs_prod_web
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      LOCAL_PROD_DRY_RUN: "${LOCAL_PROD_DRY_RUN:-False}"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      USE_WHITENOISE: "False"
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RUN_COLLECTSTATIC_ON_STARTUP: "false"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      # Liveness only — no DB/Redis dependency (use /ready/ for readiness).
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': 'localhost'}), timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - crumbs_prod

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crumbs_prod_celery_worker
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      LOCAL_PROD_DRY_RUN: "${LOCAL_PROD_DRY_RUN:-False}"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RUN_COLLECTSTATIC_ON_STARTUP: "false"
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-Q",
        "default,sms,orders,analytics",
        "--concurrency=4",
      ]
    networks:
      - crumbs_prod

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crumbs_prod_celery_beat
    restart: always
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      LOCAL_PROD_DRY_RUN: "${LOCAL_PROD_DRY_RUN:-False}"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RUN_COLLECTSTATIC_ON_STARTUP: "false"
    volumes:
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    networks:
      - crumbs_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: crumbs_prod_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - crumbs_prod

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: crumbs_prod_certbot
    profiles:
      - certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - crumbs_prod

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  certbot_conf:
  certbot_www:

networks:
  crumbs_prod:
    driver: bridge
