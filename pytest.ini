[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    integration: full multi-service flow tests
    concurrency: race-condition tests (require CRUMBS_TEST_POSTGRES=1 and PostgreSQL)
    celery: async task and idempotency tests
    edge_case: failure and abuse scenario tests
    slow: longer-running tests
    zarinpal_integration: opt-in Zarinpal checkout flow tests (require ZARINPAL_MERCHANT_ID)

# PostgreSQL concurrency mode (see tests/README.md):
#   CRUMBS_TEST_POSTGRES=1 pytest -m concurrency -v
# Env: TEST_POSTGRES_DB, TEST_POSTGRES_USER, TEST_POSTGRES_PASSWORD,
#      TEST_POSTGRES_HOST, TEST_POSTGRES_PORT
